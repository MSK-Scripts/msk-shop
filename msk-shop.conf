<VirtualHost *:80>
    ServerName test.msk-scripts.de
    ServerAlias msk-scripts.de
    # Redirect permanent / https://test.msk-scripts.de/

    RewriteEngine on
    RewriteCond %{SERVER_NAME} =test.msk-scripts.de [OR]
    RewriteCond %{SERVER_NAME} =msk-scripts.de
    RewriteRule ^ https://%{SERVER_NAME}%{REQUEST_URI} [END,NE,R=permanent]
</VirtualHost>