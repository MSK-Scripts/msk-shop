version: 2

updates:
  # ── npm (Next.js app) ─────────────────────────────────────────────────────
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "08:00"
      timezone: "Europe/Berlin"
    # Group all non-breaking updates into a single PR to reduce noise
    groups:
      dependencies:
        update-types:
          - "minor"
          - "patch"
    # ESLint v10+ is not yet supported by eslint-config-next@15.x —
    # block major bumps until Next.js officially supports the new major.
    # eslint-config-next must stay in sync with the installed Next.js version.
    ignore:
      - dependency-name: "eslint"
        update-types: ["version-update:semver-major"]
      - dependency-name: "eslint-config-next"
        update-types: ["version-update:semver-major"]
    # Security updates always get their own PR regardless of grouping
    open-pull-requests-limit: 10
    labels:
      - "dependencies"
      - "automated"
    commit-message:
      prefix: "chore(deps)"

  # ── GitHub Actions ────────────────────────────────────────────────────────
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "08:00"
      timezone: "Europe/Berlin"
    labels:
      - "dependencies"
      - "github-actions"
    commit-message:
      prefix: "chore(actions)"
