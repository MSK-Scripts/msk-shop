version: 2

updates:
  # ── npm (Next.js app) ─────────────────────────────────────────────────────
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "08:00"
      timezone: "Europe/Berlin"
    # Groups are matched in order, the first match wins.
    groups:
      # @vitest/coverage-v8 requires the same vitest major as a peer, so one
      # without the other can never install (npm ci fails with ERESOLVE, as
      # #47 and #48 did). No update-types filter on purpose: the major bumps
      # are exactly the case where they must travel together.
      vitest:
        patterns:
          - "vitest"
          - "@vitest/*"
      # Group all remaining non-breaking updates into a single PR to reduce noise
      dependencies:
        update-types:
          - "minor"
          - "patch"
    # Major bumps that need a person, not a PR. Minor and patch updates of these
    # packages still arrive through the groups above.
    # - eslint: a new major has to be supported by every plugin eslint-config-next
    #   bundles (react, import, jsx-a11y) before it installs cleanly
    # - eslint-config-next: moves in lockstep with next, bump both by hand
    # - next: every major so far renamed conventions (middleware.ts became
    #   proxy.ts in 16) and removed `next lint`
    # - tailwindcss: design tokens live in app/globals.css (@theme), a major can
    #   change how they compile
    # - typescript: typescript-eslint caps its peer range (currently <6.1.0), so a
    #   new major breaks lint before it breaks the build
    # - lucide-react: majors remove icons (1.0 dropped every brand mark)
    # - @types/node: follows the Node.js major on the server (24), not the
    #   newest published types
    ignore:
      - dependency-name: "eslint"
        update-types: ["version-update:semver-major"]
      - dependency-name: "eslint-config-next"
        update-types: ["version-update:semver-major"]
      - dependency-name: "next"
        update-types: ["version-update:semver-major"]
      - dependency-name: "tailwindcss"
        update-types: ["version-update:semver-major"]
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major"]
      - dependency-name: "lucide-react"
        update-types: ["version-update:semver-major"]
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
    # Security updates always get their own PR regardless of grouping
    open-pull-requests-limit: 10
    labels:
      - "dependencies"
      - "automated"
    commit-message:
      prefix: "chore(deps)"

  # ── GitHub Actions ────────────────────────────────────────────────────────
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "08:00"
      timezone: "Europe/Berlin"
    labels:
      - "dependencies"
      - "github-actions"
    commit-message:
      prefix: "chore(actions)"
