name: Deploy

# Auto-Deploy auf den Produktiv-Server (server-side git checkout + Build via
# scripts/deploy.sh).
#
# Löst aus, sobald der CI-Workflow auf `main` erfolgreich war (workflow_run).
# Zusätzlich manuell triggerbar via "Run workflow" — optional mit einem
# Commit-SHA zum Zurückrollen (workflow_dispatch.commit_sha).
#
# Benötigte GitHub-Secrets:
#   - DEPLOY_SSH_KEY           Private-Key des Action-Keys (ed25519).
#   - DEPLOY_HOST              Zielhost, z. B. msk-scripts.de bzw. Server-IP.
#   - DEPLOY_HOST_FINGERPRINT  Output von `ssh-keyscan -t ed25519 [-p <port>] <host>`.
#   - DEPLOY_USER (optional)   SSH-Benutzer (Default: root).
#   - DEPLOY_PORT (optional)   SSH-Port (Default: 22).
#
# Der Action-Key in authorized_keys ist per ForceCommand auf
# `/opt/msk-shop/scripts/deploy.sh` festgenagelt — selbst bei Key-Leak kann nur
# deploy.sh laufen. Der SHA kommt via $SSH_ORIGINAL_COMMAND an.

on:
  workflow_run:
    workflows: ['CI']
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      commit_sha:
        description: 'Optionaler Commit-SHA (Rollback). Leer = letzter main-Stand.'
        required: false
        default: ''

permissions:
  contents: read

# Nur einen Deploy gleichzeitig — laufende Deploys nicht abbrechen.
concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy auf Produktion
    runs-on: ubuntu-latest
    # Auf workflow_run nur deployen, wenn die CI grün war. workflow_dispatch
    # umgeht das absichtlich (z. B. Rollback bei rotem CI).
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    environment:
      name: production
      url: https://www.msk-scripts.de/
    steps:
      - name: Checkout (nur für den Workflow-Code)
        uses: actions/checkout@v6

      - name: SSH-Agent mit Action-Key laden
        uses: webfactory/ssh-agent@v0.10.0
        with:
          ssh-private-key: ${{ secrets.DEPLOY_SSH_KEY }}

      - name: Server-Fingerprint in known_hosts schreiben
        run: |
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          # Strict Host-Key-Prüfung: kein StrictHostKeyChecking=no.
          echo "${{ secrets.DEPLOY_HOST_FINGERPRINT }}" >> ~/.ssh/known_hosts
          chmod 644 ~/.ssh/known_hosts

      - name: Deploy-Skript auslösen
        env:
          # workflow_run: der vom CI getestete Commit. workflow_dispatch:
          # optional vom Bediener gesetzt. Fallback: github.sha.
          COMMIT_SHA: ${{ github.event.inputs.commit_sha || github.event.workflow_run.head_sha || github.sha }}
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER || 'root' }}
          DEPLOY_PORT: ${{ secrets.DEPLOY_PORT || '22' }}
        run: |
          set -euo pipefail
          echo "Deploy commit $COMMIT_SHA an $DEPLOY_USER@$DEPLOY_HOST:$DEPLOY_PORT"
          ssh -p "$DEPLOY_PORT" -o BatchMode=yes "$DEPLOY_USER@$DEPLOY_HOST" \
            "/opt/msk-shop/scripts/deploy.sh $COMMIT_SHA"
