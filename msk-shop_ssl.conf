<VirtualHost *:443>
    ServerName www.msk-scripts.de
    ServerAlias msk-scripts.de

    # SSL — replace with your actual cert paths (e.g. Let's Encrypt)
    SSLEngine on
    SSLCertificateFile /etc/letsencrypt/live/www.msk-scripts.de/fullchain.pem
    SSLCertificateKeyFile /etc/letsencrypt/live/www.msk-scripts.de/privkey.pem
    Include /etc/letsencrypt/options-ssl-apache.conf

    # Under Construction Seite + benötigte Assets direkt ausliefern (VOR ProxyPass!)
    # Das ! verhindert dass diese Pfade durch den Proxy geleitet werden
    Alias /msk-shop/under-construction.html /var/www/html/msk-shop/under-construction.html
    Alias /msk-shop/logo.png /var/www/html/msk-shop/logo.png
    Alias /msk-shop/favicon.ico /var/www/html/msk-shop/favicon.ico
    ProxyPass /msk-shop/under-construction.html !
    ProxyPass /msk-shop/logo.png !
    ProxyPass /msk-shop/favicon.ico !

    # Proxy to Next.js on port 3005
    ProxyPreserveHost On
    ProxyPass         / http://127.0.0.1:3005/
    ProxyPassReverse  / http://127.0.0.1:3005/

    # WebSocket support (for Next.js HMR in dev — optional in prod)
    RewriteEngine on
    RewriteCond %{HTTP:Upgrade} websocket [NC]
    RewriteCond %{HTTP:Connection} upgrade [NC]
    RewriteRule ^/?(.*) ws://127.0.0.1:3005/$1 [P,L]

    ErrorLog ${APACHE_LOG_DIR}/msk-shop-error.log
    CustomLog ${APACHE_LOG_DIR}/msk-shop-access.log combined

    # Bei Proxy-Fehler (Service gestoppt) → Under Construction Seite
    ProxyErrorOverride On
    ErrorDocument 502 /msk-shop/under-construction.html
    ErrorDocument 503 /msk-shop/under-construction.html

    # Security Headers für die Under Construction Seite
    # Werden gesetzt wenn Apache die Datei direkt ausliefert (Service gestoppt)
    <Files "under-construction.html">
        Header always set X-Content-Type-Options "nosniff"
        Header always set X-Frame-Options "SAMEORIGIN"
        Header always set Referrer-Policy "strict-origin-when-cross-origin"
        Header always set Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=()"
        Header always set Strict-Transport-Security "max-age=31536000; includeSubDomains"
        Header always set Content-Security-Policy "default-src 'self'; script-src 'none'; style-src 'unsafe-inline'; img-src 'self'; font-src 'none'; frame-ancestors 'self'"
    </Files>
</VirtualHost>
