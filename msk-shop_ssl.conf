<VirtualHost *:443>
    ServerName test.msk-scripts.de
    ServerAlias msk-scripts.de

    # SSL — replace with your actual cert paths (e.g. Let's Encrypt)
    SSLEngine on
    SSLCertificateFile /etc/letsencrypt/live/test.msk-scripts.de/fullchain.pem
    SSLCertificateKeyFile /etc/letsencrypt/live/test.msk-scripts.de/privkey.pem
    Include /etc/letsencrypt/options-ssl-apache.conf

    # Proxy to Next.js on port 3005
    ProxyPreserveHost On
    ProxyPass         / http://127.0.0.1:3005/
    ProxyPassReverse  / http://127.0.0.1:3005/

    # WebSocket support (for Next.js HMR in dev — optional in prod)
    RewriteEngine on
    RewriteCond %{HTTP:Upgrade} websocket [NC]
    RewriteCond %{HTTP:Connection} upgrade [NC]
    RewriteRule ^/?(.*) ws://127.0.0.1:3005/$1 [P,L]

    # Security headers
    Header always set X-Content-Type-Options "nosniff"
    Header always set X-Frame-Options "SAMEORIGIN"
    Header always set Referrer-Policy "strict-origin-when-cross-origin"

    ErrorLog ${APACHE_LOG_DIR}/msk-shop-error.log
    CustomLog ${APACHE_LOG_DIR}/msk-shop-access.log combined
</VirtualHost>
